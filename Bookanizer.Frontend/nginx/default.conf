# Bookanizer — nginx reverse proxy
#
# Serves the built Quasar SPA (static files) and reverse-proxies API calls
# to the C# REST server. The frontend talks to a relative "/api" base URL,
# so this single origin handles both the app and the backend transparently
# (no CORS needed in the browser).
#
# Container assumptions (see docker-compose example at the bottom):
#   - This nginx serves SPA files from /usr/share/nginx/html
#   - The REST server is reachable at the hostname "rest" on port 8080
# Adjust the upstream to match your compose service name / port.

upstream bookanizer_rest {
    # Docker Compose service name of the C# REST server.
    server rest:8080;
}

server {
    listen 80;
    server_name _;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- API: forward everything under /api to the REST server. -------------
    # The SPA calls e.g. GET /api/books/search. We strip the /api prefix so
    # the REST server sees /books/search. Remove the trailing-slash rewrite
    # if your controllers are actually mounted under /api.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://bookanizer_rest;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through Authorization (bearer token).
        proxy_pass_request_headers on;

        # Reasonable timeouts; recommendation calls may be slower.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Static SPA assets with long cache. ---------------------------------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: serve index.html for client-side (history) routes. ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
